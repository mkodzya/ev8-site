<head>

<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: dark thesis band, then a light scroll of working sections; numbers set in the site's display face, text in Inter (the site's second face, which carries Cyrillic). */
:root{
  --bg:#fbfbfb; --surface:#ffffff; --surface-2:#f3f3f3; --ink:#0b0b0b; --muted:#5d5d5d; --faint:#989898;
  --line:#e6ebe7; --brand:#819481; --accent:#557553; --accent-soft:#e3ebe3; --lime:#e0ffa2; --on-lime:#0b0b0b;
  --band:#0b0b0b; --band-ink:#ffffff; --band-muted:#a9aea9; --band-line:#262b26;
  --grid:#ebebeb; --ghost:#c3c8c3; --warn:#c8402f;
  --display:"Be Vietnam Pro","Inter","Noto Sans Georgian",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Inter","Noto Sans Georgian",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e110e; --surface:#151a15; --surface-2:#1b211b; --ink:#eef1ee; --muted:#a5b0a5; --faint:#7d877d;
  --line:#263026; --brand:#a2b9a2; --accent:#a2b9a2; --accent-soft:#1f2b20; --lime:#e0ffa2; --on-lime:#0b0b0b;
  --band:#050605; --band-ink:#ffffff; --band-muted:#a9aea9; --band-line:#232923;
  --grid:#232923; --ghost:#4a544a; --warn:#ef6b5a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e110e; --surface:#151a15; --surface-2:#1b211b; --ink:#eef1ee; --muted:#a5b0a5; --faint:#7d877d;
  --line:#263026; --brand:#a2b9a2; --accent:#a2b9a2; --accent-soft:#1f2b20; --lime:#e0ffa2; --on-lime:#0b0b0b;
  --band:#050605; --band-ink:#ffffff; --band-muted:#a9aea9; --band-line:#232923;
  --grid:#232923; --ghost:#4a544a; --warn:#ef6b5a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.bar img{height:22px;display:block}
.bar-r{display:flex;align-items:center;gap:10px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:99px;padding:3px}
.seg button{font:600 13px var(--body);border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:99px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.site{font:600 13px var(--body);text-decoration:none;color:var(--accent);padding:6px 4px}
.site:hover{text-decoration:underline}

/* hero band */
.hero{background:var(--band);color:var(--band-ink)}
.hero .wrap{padding-block:48px 36px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:28px;align-items:center}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.tag{font:600 12.5px var(--body);padding:5px 12px;border-radius:99px;background:var(--lime);color:var(--on-lime)}
.tag.ghost{background:transparent;color:var(--lime);border:1px solid #557553}
.hero h1{font:800 clamp(34px,5.4vw,58px)/1.02 var(--body);letter-spacing:-.035em}
.hero h1 em{font-style:normal;color:var(--lime)}
.lede{margin-top:18px;font-size:17px;color:var(--band-muted);max-width:56ch}
.lede b{color:var(--lime);font-weight:700}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 15px var(--body);text-decoration:none;padding:12px 20px;border-radius:12px;border:1px solid transparent;cursor:pointer}
.btn.primary{background:#819481;color:#fff}
.btn.primary:hover{background:#628767}
.btn.line{border-color:#3a423a;color:var(--band-ink)}
.btn.line:hover{border-color:#819481}
.batch{margin:0;justify-self:end;width:100%;max-width:440px}
.batch img{display:block;width:100%;height:auto;-webkit-mask-image:radial-gradient(ellipse 58% 60% at 50% 52%,#000 38%,transparent 76%);mask-image:radial-gradient(ellipse 58% 60% at 50% 52%,#000 38%,transparent 76%)}
.batch figcaption{display:flex;align-items:center;justify-content:flex-end;gap:14px;margin-top:-6px;text-align:right}
.batch .cap{color:var(--band-muted);font-size:13.5px;line-height:1.35}
.batch .x{font:800 clamp(40px,5vw,56px)/1 var(--display);color:#819481;letter-spacing:-.04em}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-top:40px;padding-top:24px;border-top:1px solid var(--band-line)}
.kpi b{display:block;font:700 clamp(28px,3.6vw,40px)/1 var(--display);color:var(--lime);letter-spacing:-.03em}
.kpi span{display:block;margin-top:8px;font-size:13.5px;color:var(--band-muted);line-height:1.35}

/* sections */
section{padding-block:56px 8px}
.eyebrow{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:10px}
section h2{font:800 clamp(24px,3vw,34px)/1.1 var(--body);letter-spacing:-.025em;max-width:22ch}
.sec-lede{margin-top:10px;color:var(--muted);max-width:60ch}

/* how it works */
.steps{list-style:none;padding:0;margin:28px 0 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;counter-reset:s}
.step{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;position:relative;min-width:0}
.step svg{width:44px;height:44px;display:block;margin-bottom:14px}
.step .n{position:absolute;top:18px;right:20px;font:700 13px var(--display);color:var(--faint)}
.step h3{font:700 16px/1.25 var(--body);margin-bottom:6px}
.step p{font-size:14px;color:var(--muted)}

/* calculator */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px;margin-top:28px}
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:32px;align-items:center}
.amount{font:800 clamp(40px,6vw,64px)/1 var(--display);letter-spacing:-.04em}
.amount-sub{color:var(--muted);font-size:14px;margin-top:6px}
input[type=range]{width:100%;margin-top:22px;accent-color:#557553;height:28px}
.ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.out{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cell{background:var(--surface-2);border-radius:14px;padding:16px}
.cell .l{font-size:12.5px;color:var(--muted)}
.cell .v{font:700 26px/1.1 var(--display);letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.cell.hi{background:var(--lime);color:var(--on-lime)}
.cell.hi .l{color:#3d4a3d}

/* stress */
.stress-head{display:flex;flex-wrap:wrap;gap:20px 40px;align-items:end;justify-content:space-between}
.util label{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
.util .pct{font:800 40px/1 var(--display);letter-spacing:-.03em}
.util{min-width:min(320px,100%);flex:1}
.verdict{background:var(--accent-soft);border-radius:14px;padding:14px 18px;min-width:min(260px,100%)}
.verdict .l{font-size:12.5px;color:var(--muted)}
.verdict .v{font:700 24px/1.15 var(--display);letter-spacing:-.02em;margin-top:4px}
.chartbox{margin-top:22px;overflow-x:auto}
.chartbox svg{display:block;width:100%;min-width:560px;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:18px;margin-top:10px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px}
.mini .cell .v{font-size:21px}

/* status + funds */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:28px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;min-width:0}
.card h3{font:700 18px var(--body);margin-bottom:14px}
.sub{font:600 11.5px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:16px 0 8px}
.sub:first-of-type{margin-top:0}
ul.dots{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.dots li{padding-left:16px;position:relative}
ul.dots li::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:7px;border-radius:50%;background:var(--brand)}
.fbar{display:flex;height:14px;border-radius:99px;overflow:hidden;margin-bottom:16px}
.fbar div{height:100%}
ul.funds{list-style:none;margin:0;padding:0;display:grid;gap:9px}
ul.funds li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center}
ul.funds i{width:12px;height:12px;border-radius:4px}
ul.funds b{font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:14px;padding-top:12px;font-weight:700}
.note{font-size:12.5px;color:var(--faint);margin-top:10px}

/* terms */
.terms{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:28px}
.term{background:var(--accent-soft);border-radius:18px;padding:20px;min-width:0}
.term .l{font:600 11.5px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.term .v{font:700 24px/1.15 var(--display);letter-spacing:-.02em;margin:8px 0 6px}
.term p{font-size:14px;color:var(--muted)}

/* footer */
footer{margin-top:64px;background:var(--band);color:var(--band-ink)}
footer .wrap{padding-block:40px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:center}
footer h2{font:800 clamp(24px,3vw,32px)/1.1 var(--body);letter-spacing:-.025em}
footer p{color:var(--band-muted);margin-top:8px}
.contacts{display:grid;gap:10px}
.crow{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--band-line);border-radius:12px;padding:10px 12px}
.crow span{font:600 16px var(--body);user-select:all;overflow-wrap:anywhere}
.crow .acts{display:flex;gap:6px;flex-shrink:0}
.mini-btn{font:600 12.5px var(--body);background:#1c221c;color:var(--band-ink);border:1px solid #2e362e;border-radius:8px;padding:6px 10px;cursor:pointer;text-decoration:none}
.mini-btn:hover{border-color:#819481}
.fn{max-width:1080px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));color:#7d877d;font-size:12.5px}

:lang(ka) .eyebrow,:lang(ka) .sub,:lang(ka) .term .l{text-transform:none;letter-spacing:0}
:lang(ka) .hero h1{font-size:clamp(30px,4.6vw,50px);letter-spacing:-.02em}
/* swap network */
.infra-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:24px}
.itile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.itile b{display:block;font:800 30px/1 var(--display);color:var(--accent);letter-spacing:-.03em}
.itile span{display:block;margin-top:8px;font-size:13.5px;color:var(--muted);line-height:1.35}
.netline{margin-top:14px;font-size:14px;color:var(--muted);display:flex;gap:10px;align-items:flex-start}
.netline i{flex-shrink:0;width:12px;height:12px;border-radius:50%;background:var(--lime);border:2px solid var(--accent);margin-top:4px}
h3.why{font:700 20px/1.25 var(--body);margin-top:36px;text-wrap:balance}
.faq.why-grid{margin-top:16px}
/* team, what-if, process */
.team{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:28px}
.person{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0}
.av{width:52px;height:52px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 20px var(--display);flex-shrink:0}
.person b{font:700 18px var(--body)}
.person p{color:var(--muted);font-size:14px;margin-top:2px}
.faq{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:28px}
.qa{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0}
.qa h3{font:700 16px/1.3 var(--body);margin-bottom:6px}
.qa p{color:var(--muted);font-size:14px}
.steps.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.steps.three .step h3{padding-right:20px}
.cell .s{font-size:12px;color:var(--faint);margin-top:4px}
@media (max-width:860px){
  .steps.three{grid-template-columns:1fr}
  .infra-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero-grid{grid-template-columns:1fr}
  .batch{justify-self:start;max-width:380px}
  .batch figcaption{justify-content:flex-start;text-align:left}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .calc,.two{grid-template-columns:1fr}
  .terms{grid-template-columns:repeat(2,minmax(0,1fr))}
  footer .wrap{grid-template-columns:1fr}
}
@media (max-width:520px){
  .team,.faq{grid-template-columns:1fr}
  .steps,.terms,.mini{grid-template-columns:1fr}
  .out{grid-template-columns:1fr 1fr}
  .panel{padding:20px}
}
@media (prefers-reduced-motion:no-preference){
  .line-path{transition:d .35s ease}
}
</style>

</head>

    const s70 = i===0?0 : i===1?Math.min(12,50*u) : i===2?Math.min(40,50*u) : 50*u;
    const rev = old*OLD + s70*(S70+SWAP);
    const opex = 3500 + (i>0?11235/12:0) + 15*(old+s70);
    const capex = i===0?71058 : i===1?18900 : i===2?-13900 : 0;
    const cpn = i>=3?COUPON:0;
    cash += rev-opex-capex-cpn;
    rows.push({i,cash,op:rev-opex});
    if(i<3) low=Math.min(low,cash);
  }
  const hit=rows.find(r=>r.i>=3&&r.cash>=REF);
  return {rows,hit,op:rows[N-1].op,low};
}
function monthOf(i){const m=(11+i)%12, y=2026+Math.floor((11+i)/12);return {m,y}}

/* ---- chart ---- */
function drawChart(u){
  const t=T[lang], svg=$("chart"), W=760,H=300,L=58,R=730,TOP=20,B=258, YMAX=250000;
  const x=i=>L+i*(R-L)/(N-1), y=v=>B-Math.max(v,0)/YMAX*(B-TOP);
  const base=model(0.9), cur=model(u);
  const ln=rows=>rows.map((r,k)=>(k?"L":"M")+x(r.i).toFixed(1)+" "+y(r.cash).toFixed(1)).join(" ");
  let g="";
  for(const v of [0,50000,100000,150000,200000,250000]){g+=`<line x1="${L}" x2="${R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="var(--faint)">${v?v/1000+"K":"0"}</text>`}
  for(let i=0;i<N;i+=3){const {m,y:yy}=monthOf(i);g+=`<text x="${x(i)}" y="${B+22}" text-anchor="middle" font-size="12" fill="var(--faint)">${t.months[(m+1)%12]} ${String(yy).slice(2)}</text>`}
  g+=`<line x1="${L}" x2="${R}" y1="${y(REF)}" y2="${y(REF)}" stroke="var(--ink)" stroke-dasharray="5 5" opacity=".7"/>`;
  if(Math.abs(u-0.9)>1e-9) g+=`<path d="${ln(base.rows)}" fill="none" stroke="var(--ghost)" stroke-width="2"/><text x="${R-4}" y="${y(base.rows[N-1].cash)-8}" text-anchor="end" font-size="12" fill="var(--faint)">90%</text>`;
  g+=`<path class="line-path" d="${ln(cur.rows)}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>`;
  cur.rows.forEach(r=>{g+=`<circle cx="${x(r.i)}" cy="${y(r.cash)}" r="2.6" fill="var(--accent)"><title>${t.months[(monthOf(r.i).m+1)%12]} ${monthOf(r.i).y}: ${fmt(r.cash)}</title></circle>`});
  if(cur.hit){const hx=x(cur.hit.i),hy=y(cur.hit.cash);const {m,y:yy}=monthOf(cur.hit.i);
    const label=`${t.monthsNom[m]} ${yy}`;const right=hx<R-170;
    g+=`<circle cx="${hx}" cy="${hy}" r="7" fill="var(--lime)" stroke="var(--accent)" stroke-width="2.5"/><text x="${right?hx+12:hx-12}" y="${hy-12}" text-anchor="${right?"start":"end"}" font-size="13" font-weight="700" fill="var(--ink)">${label}</text>`}
  svg.setAttribute("aria-label",t.chartAria);svg.innerHTML=g;
  const p=$("util-out");p.textContent=Math.round(u*100)+"%";
  if(cur.hit){const {m,y:yy}=monthOf(cur.hit.i);$("verdict").textContent=t.verdictFmt(t.monthsLong[m],yy)}else $("verdict").textContent=t.notYet;
  $("m-op").textContent=fmt(cur.op);
  $("m-cov").textContent=(cur.op/COUPON).toFixed(1).replace(".",lang==="en"?".":",")+"×";
  $("m-low").textContent=fmt(cur.low);
}

/* ---- calculator ---- */
function calc(){
  const t=T[lang], a=+$("ticket").value;
  $("amt").textContent=fmt(a);
  $("amt-sub").textContent=t.amtSub(Math.round(a/RAISE*100));
  $("o-month").textContent=fmt(a*0.015);
  $("o-min").textContent=fmt(a*0.18);
  $("o-18").textContent=fmt(a*0.27);
  const h=model(+$("util").value/100).hit;
  if(h){const {m,y}=monthOf(h.i);$("o-back").textContent=t.backFmt(t.months[(m+1)%12],y)}else $("o-back").textContent="08.2028";
}

/* ---- funds ---- */
const FUNDS=[[57358,"#557553"],[13900,"#819481"],[10000,"#a2b9a2"],[5000,"#c9d6c9"],[3700,"#e0ffa2"]];
function funds(){
  const t=T[lang], tot=FUNDS.reduce((s,f)=>s+f[0],0);
  $("fbar").innerHTML=FUNDS.map(f=>`<div style="width:${f[0]/tot*100}%;background:${f[1]}"></div>`).join("");
  $("funds").innerHTML=FUNDS.map((f,k)=>`<li><i style="background:${f[1]}"></i><span>${t.funds[k]}</span><b>${fmt(f[0])}</b></li>`).join("");
  $("ftotal").textContent=fmt(tot);
}

/* ---- i18n ---- */
function apply(){
  const t=T[lang];document.documentElement.lang=lang;document.title=t.title;
  document.querySelectorAll("[data-i]").forEach(el=>{const v=t[el.dataset.i];if(typeof v!=="string")return; if(el.hasAttribute("data-html"))el.innerHTML=v; else el.textContent=v});
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
  funds();calc();drawChart(+$("util").value/100);
}
document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;try{localStorage.setItem("ev8-lang",lang)}catch(e){};try{history.replaceState(null,"","#"+lang)}catch(e){};apply()}));
$("ticket").addEventListener("input",calc);
$("util").addEventListener("input",()=>{drawChart(+$("util").value/100);calc()});
document.querySelectorAll("[data-copy]").forEach(b=>b.addEventListener("click",()=>{
  const el=$(b.dataset.copy), txt=el.textContent.trim(), t=T[lang];
  const done=()=>{b.textContent=t.copied;setTimeout(()=>b.textContent=t.copy,1600)};
  const sel=()=>{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)};
  try{navigator.clipboard.writeText(txt).then(done,sel)}catch(e){sel()}
}));
window.addEventListener("hashchange",()=>{const h=location.hash.replace("#","");if((h==="en"||h==="ru"||h==="ka")&&h!==lang){lang=h;apply()}});
apply();
</script>
