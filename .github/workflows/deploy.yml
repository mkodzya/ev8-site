# Every push to develop or main builds the site and ships it to the server.
# The receiving half is deploy/site-receive.sh in mkodzya/ev8-ops, which also
# keeps a reference copy of this file (deploy/site-github-workflow.yml).
#
# develop → test.ops.ev8.ge/garage/site/ (built with base /garage/site/)
# main    → ev8.ge                       (built with base /)
#
# So a merge into main IS the release of the site: made on Kardu's or Mika's
# word, never by a session on its own (CLAUDE.md, rule 2).
#
# A release also carries the site's own settings for the server's door —
# old addresses, how long a browser keeps what (edge/site.caddy) — and the
# last step checks that the door took them.
#
# Once a day both are built again as they are, for one number: the price of
# petrol in the calculator's comparison, read while the site is built
# (scripts/fuel-price.mjs). That run changes no code and releases nothing new;
# if the price cannot be read it ships nothing, and the site keeps the price
# it has, with its date.
#
# Secrets of this repository, set by deploy/site-deploy-setup.sh in ev8-ops:
#   SITE_DEPLOY_KEY          private key of ev8site@204.168.149.105
#   SITE_DEPLOY_KNOWN_HOSTS  that server's host key
name: Deploy

on:
  push:
    branches: [develop, main]
  schedule:
    # 09:30 in Tbilisi (UTC+4, no summer time).
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Which branches this run builds. A push or a hand-started run builds its
  # own branch; the daily run builds develop, and main too once a release has
  # brought the price script to it — an older main is left as it was shipped.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      branches: ${{ steps.pick.outputs.branches }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" != schedule ]; then
            echo "branches=$(jq -cn --arg b "$REF_NAME" '[$b]')" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api "repos/$REPO/contents/scripts/fuel-price.mjs?ref=main" --silent 2>/dev/null; then
            echo 'branches=["develop","main"]' >> "$GITHUB_OUTPUT"
          else
            echo "main has no scripts/fuel-price.mjs yet: the daily run leaves it alone."
            echo 'branches=["develop"]' >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.plan.outputs.branches) }}
    # One deploy per branch at a time, in order; a second one waits, it does
    # not cancel the one that is shipping.
    concurrency:
      group: deploy-${{ matrix.branch }}
      cancel-in-progress: false
    env:
      TARGET: ${{ matrix.branch == 'main' && 'prod' || 'test' }}
      SITE_BASE: ${{ matrix.branch == 'main' && '/' || '/garage/site/' }}
      # The preview build is marked noindex by the site itself. Written from
      # develop's side on purpose: `== 'main' && '' || '1'` gives '1' on main
      # too (an empty string is false to &&), and ev8.ge would ask search
      # engines not to index it.
      PREVIEW: ${{ matrix.branch != 'main' && '1' || '' }}
      ASTRO_TELEMETRY_DISABLED: '1'
      CHECK_URL: ${{ matrix.branch == 'main' && 'https://ev8.ge/' || 'https://test.ops.ev8.ge/garage/site/' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: The petrol price of the day
        env:
          # What the live site was built with: the fallback of a build that
          # cannot read the price page, so a push never steps back to an older price.
          FUEL_LIVE_URL: ${{ env.CHECK_URL }}fuel.json
          STRICT: ${{ github.event_name == 'schedule' && '--strict' || '' }}
        run: node scripts/fuel-price.mjs $STRICT
      - run: npm run build
      - name: The site's settings for the server's door
        run: |
          # edge/site.caddy travels inside the release as /_edge/site.caddy,
          # stamped with the commit it was built from: the door answers with
          # the stamp of the settings it runs (checked below, after shipping).
          rev=$(git rev-parse --short HEAD)
          install -d dist/_edge
          sed "s/^header X-Site-Edge \"__REV__\"/header X-Site-Edge \"$rev\"/" edge/site.caddy > dist/_edge/site.caddy
          grep -q "X-Site-Edge \"$rev\"" dist/_edge/site.caddy || { echo "edge/site.caddy has lost its X-Site-Edge line."; exit 1; }
          echo "EDGE_REV=$rev" >> "$GITHUB_ENV"
      - name: A production build must be indexable
        if: matrix.branch == 'main'
        run: |
          if grep -q 'content="noindex' dist/index.html; then
            echo "The production build says noindex: PREVIEW leaked into it."
            exit 1
          fi
      - name: Ship to the server
        env:
          KEY: ${{ secrets.SITE_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.SITE_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar -czf - -C dist . | ssh -o BatchMode=yes ev8site@204.168.149.105 "$TARGET"
      - name: Check it answers
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$CHECK_URL")
          echo "$CHECK_URL → $code"
          # 401: the preview is behind its login (deploy/set-site-password.sh).
          case "$code" in 200 | 401) ;; *) exit 1 ;; esac
      - name: The door took the site's settings
        if: matrix.branch == 'main'
        run: |
          # The door looks at the release every fifteen seconds, tries its
          # settings together with its whole config, and takes them only if
          # that validates. Two minutes is ample.
          for i in $(seq 1 12); do
            got=$(curl -sI https://ev8.ge/ | tr -d '\r' | awk 'tolower($1)=="x-site-edge:"{print $2}')
            if [ "$got" = "$EDGE_REV" ]; then echo "The door runs the settings of $EDGE_REV."; exit 0; fi
            sleep 10
          done
          if [ -z "$got" ]; then
            echo "::warning::The door does not read the site's settings yet: no X-Site-Edge in its answer."
            exit 0
          fi
          echo "The door still runs the settings of $got, not of $EDGE_REV:"
          echo "edge/site.caddy has a mistake and the door refused it. The pages of this release are live;"
          echo "the door's previous settings stay in force. Fix edge/site.caddy and release again."
          exit 1
